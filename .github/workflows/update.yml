name: Auto Update VPN Subscription

on:
  schedule:
    # Автозапуск каждые 30 минут
    - cron: '*/30 * * * *'
  workflow_dispatch: # Кнопка ручного запуска

permissions:
  contents: write

jobs:
  update-vpn:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2 aiohttp aiohttp-socks PySocks urllib3 maxminddb
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: ⚙️ Setup Xray Core
        run: |
          if [ ! -f ./xray ] || [ ! -x ./xray ]; then
            echo "Скачивание ядра Xray Core..."
            curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
            unzip -o xray.zip xray geoip.dat geosite.dat 2>/dev/null || true
            rm -f xray.zip
          fi
          chmod +x ./xray

      - name: 🚀 Run VPN Scanner (Тестирование серверов)
        run: python main.py

      - name: 📤 Commit and Push results to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем обновленные файлы
          git add -A
          
          COUNT=$(python3 -c "import json; print(len(json.load(open('stats.json'))['servers']))" 2>/dev/null || echo "?")
          
          if git diff --staged --quiet; then
            echo "Файлы идентичны предыдущему запуску."
          else
            git commit -m "🚀 Auto-Update: $COUNT Active Servers | $(date -u +'%Y-%m-%d %H:%M UTC')"
            git stash --include-untracked
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD
            echo "✅ Репозиторий успешно обновлен!"
          fi

      # Прикрепляем готовый файл подписки прямо к отчету запуска
      - name: 📦 Upload FL1PVPN as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FL1PVPN-Subscription
          path: |
            FL1PVPN
            stats.json
          retention-days: 7
