name: Auto Update VPN Subscription

on:
  schedule:
    # Каждые 30 минут, в UTC (GitHub использует UTC, не локальное время)
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Не даём двум прогонам работать одновременно: перекрывающиеся запуски
# конфликтовали при git push и дважды тестировали одних и тех же узлов.
concurrency:
  group: update-vpn-subscription
  cancel-in-progress: true

jobs:
  update-vpn:
    runs-on: ubuntu-latest
    # Страховка от зависшего прогона (дефолт GitHub — 360 минут)
    timeout-minutes: 50
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Единственный источник правды по зависимостям — requirements.txt
          # (раньше пакеты ставились дважды: явным списком и из файла)
          pip install -r requirements.txt

      - name: ⚙️ Setup Xray Core (последняя версия)
        run: |
          # Всегда берём ПОСЛЕДНЮЮ версию Xray: hysteria2 поддерживается только в v25+,
          # а старый бинарник из репозитория мог устареть.
          LATEST="$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r .tag_name)"
          CURRENT="$(./xray version 2>/dev/null | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          if [ ! -x ./xray ] || [ "${CURRENT}" != "${LATEST#v}" ]; then
            echo "⬇️ Обновляю Xray: ${CURRENT:-нет} -> ${LATEST}"
            curl -sL "https://github.com/XTLS/Xray-core/releases/download/${LATEST}/Xray-linux-64.zip" -o xray.zip
            unzip -o xray.zip xray geoip.dat geosite.dat 2>/dev/null || true
            rm -f xray.zip
          else
            echo "✅ Xray уже актуален: ${CURRENT}"
          fi
          chmod +x ./xray

      - name: 🚀 Run VPN Scanner
        run: python main.py

      - name: 📤 Commit ONLY subscription
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Очищаем временные файлы
          rm -f last_update.txt vpn_scanner.log logs/*.log 2>/dev/null || true

          # Удаляем старый файл подписки, если он ещё остался (переименование)
          git rm --cached FL1PVPN 2>/dev/null || true
          rm -f FL1PVPN 2>/dev/null || true

          # Сохраняем файл подписки И историю проверок (нужна для перепроверки скорости раз в 8ч)
          git add subscription stats_history.json

          if git diff --cached --quiet; then
            echo "ℹ️ Изменений нет — коммит не нужен"
          else
            git commit -m "🚀 Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi

          # РАНЬШЕ: `git stash --include-untracked` перед pull НАВСЕГДА выбрасывал
          # незакоммиченные файлы (stash создавался и никогда не возвращался).
          # Теперь --autostash: спрятать перед rebase и ВЕРНУТЬ после него.
          BRANCH="$(git branch --show-current)"
          git pull --rebase --autostash origin "$BRANCH"
          git push origin HEAD
          echo "✅ Файл subscription успешно обновлен!"

      # ─── ОЧИСТКА ИСТОРИИ WORKFLOW ───
      # По решению владельца: удаляются ВСЕ прошлые запуски, кроме текущего.
      # Это НАМЕРЕННО (не баг) — не заменять на «хранить N последних».
      - name: 🧹 Clean old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="${{ github.run_id }}"
          RESP=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/runs?per_page=100")
          # Получаем ID всех запусков, кроме текущего
          echo "$RESP" | jq -r --argjson cur "$CURRENT" '.workflow_runs[] | select(.id != $cur) | .id' | while read -r rid; do
            echo "Удаляю запуск #$rid ..."
            curl -s -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${rid}"
            echo
          done
          echo "✅ Готово."
