name: Auto Update VPN Subscription

on:
  schedule:
    # Раз в час (не в :00 — там очередь). GitHub может задержать старт на 5–20 мин,
    # поэтому окно в 30 мин при cancel-in-progress регулярно теряло прогоны целиком.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# НЕ отменяем работающий прогон: лишний пусть подождёт в очереди
# (GitHub держит там максимум один, остальные отбрасывает сам).
concurrency:
  group: update-vpn-subscription
  cancel-in-progress: false

env:
  DATA_BRANCH: data          # ветка-хранилище subscription + stats_history.json
  MIN_NODES: 50              # sanity-check: не публиковать подписку, если узлов меньше
  MIN_RATIO_PCT: 30          # ...или меньше 30% от прошлого размера файла

jobs:
  update-vpn:
    runs-on: ubuntu-latest
    # Реальный предохранитель: скрипт сам укладывается в RUN_BUDGET_SEC (25 мин),
    # + установка + коммит. Должно быть МЕНЬШЕ интервала крона.
    timeout-minutes: 45
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Данные лежат в отдельной orphan-ветке: один коммит, force-push, история не растёт.
      # Первый запуск (ветки ещё нет) — просто стартуем с пустого состояния.
      - name: 📂 Fetch previous data
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin "$DATA_BRANCH" 2>/dev/null; then
            git checkout FETCH_HEAD -- subscription stats_history.json 2>/dev/null || true
            git reset -q -- subscription stats_history.json 2>/dev/null || true
            echo "✅ Загружены прошлые subscription/stats_history.json из ветки $DATA_BRANCH"
          else
            echo "ℹ️ Ветки $DATA_BRANCH ещё нет — холодный старт"
          fi
          cp subscription subscription.prev 2>/dev/null || true

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔎 Resolve Xray version
        id: xray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Зафиксируй версию через repo variable V1A_XRAY_VERSION, когда найдёшь ту,
          # что точно работает с hysteria2 — latest иногда ломает схему конфига.
          PINNED="${{ vars.V1A_XRAY_VERSION }}"
          if [ -n "$PINNED" ]; then
            VER="${PINNED#v}"
          else
            VER="$(gh api repos/XTLS/Xray-core/releases/latest --jq .tag_name)"
            VER="${VER#v}"
          fi
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "❌ Не удалось определить версию Xray: '$VER'"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Xray version: $VER"

      - name: 💾 Cache Xray binary
        id: cache-xray
        uses: actions/cache@v4
        with:
          path: xray
          key: xray-linux-64-${{ steps.xray.outputs.version }}

      - name: ⚙️ Download Xray Core
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VER="${{ steps.xray.outputs.version }}"
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v${VER}/Xray-linux-64.zip" -o xray.zip
          unzip -o -q xray.zip xray
          rm -f xray.zip
          chmod +x ./xray
          ./xray version | head -n1

      - name: 🚀 Run VPN Scanner
        env:
          TOKEN: ${{ github.token }}                       # раньше не передавался -> GitHub Search всегда в rate-limit
          V1A_XRAY_VERSION: ${{ steps.xray.outputs.version }}  # скрипт не дёргает API и не удалит рабочий бинарник
          V1A_RUN_BUDGET_SEC: '1500'
          PYTHONUNBUFFERED: '1'
        run: |
          chmod +x ./xray
          python main.py

      - name: 🛡 Sanity check result
        run: |
          set -euo pipefail
          [ -s subscription ] || { echo "❌ subscription пустой — не публикуем"; exit 1; }
          [ -s run_meta.json ] || { echo "❌ run_meta.json не создан — скрипт не дошёл до записи"; exit 1; }
          NODES=$(jq -r '.nodes // 0' run_meta.json)
          PREV=$(jq -r '.prev_nodes // 0' run_meta.json)
          SIZE=$(stat -c%s subscription)
          echo "Узлов: ${NODES} (в прошлой подписке: ${PREV}), файл ${SIZE} байт"
          if [ "$NODES" -lt "$MIN_NODES" ]; then
            echo "❌ Узлов меньше ${MIN_NODES} — не публикуем"; exit 1
          fi
          if [ "$PREV" -gt 0 ] && [ "$NODES" -lt $(( PREV * MIN_RATIO_PCT / 100 )) ]; then
            echo "❌ Узлов ${NODES} < ${MIN_RATIO_PCT}% от прошлых ${PREV} — похоже на сбой, не публикуем"; exit 1
          fi
          echo "✅ subscription: ${NODES} узлов, ${SIZE} байт"
          
      - name: 📤 Commit to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscription stats_history.json
          git diff --cached --quiet && { echo "ℹ️ Изменений нет"; exit 0; }
          git commit -q -m "🚀 Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || git rebase --abort
          done

      # ─── ОЧИСТКА ИСТОРИИ WORKFLOW ───
      # По решению владельца удаляются ВСЕ прошлые УСПЕШНЫЕ запуски (не «N последних»).
      # Упавшие остаются — иначе невозможно понять, почему ночью что-то сломалось.
      - name: 🧹 Clean old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${{ github.workflow_ref && 'update.yml' }}/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }} and .status == "completed" and .conclusion == "success") | .id' \
          | while read -r rid; do
              echo "Удаляю запуск #$rid"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${rid}" >/dev/null || true
            done
          echo "✅ Готово."
