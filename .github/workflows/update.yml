name: Auto Update VPN Subscription

on:
  schedule:
    # Каждые 30 минут, в UTC (GitHub использует UTC, не локальное время)
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-vpn:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2 aiohttp aiohttp-socks PySocks urllib3 maxminddb
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: ⚙️ Setup Xray Core
        run: |
          if [ ! -f ./xray ] || [ ! -x ./xray ]; then
            curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
            unzip -o xray.zip xray geoip.dat geosite.dat 2>/dev/null || true
            rm -f xray.zip
          fi
          chmod +x ./xray

      - name: 🚀 Run VPN Scanner
        run: python main.py

      - name: 📤 Commit ONLY subscription
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Очищаем временные файлы
          rm -f last_update.txt vpn_scanner.log logs/*.log 2>/dev/null || true

          # Удаляем старый файл подписки, если он ещё остался (переименование)
          git rm --cached FL1PVPN 2>/dev/null || true
          rm -f FL1PVPN 2>/dev/null || true

          # Сохраняем ТОЛЬКО файл подписки
          git add subscription

          # stats.json временно отключён (будущая реализация) — счётчик не считаем
          # COUNT=$(python3 -c "import json; print(len(json.load(open('stats.json'))['servers']))" 2>/dev/null || echo "0")

          git commit -m "🚀 Update: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Нет изменений"
          git stash --include-untracked
          git pull --rebase origin main || git pull --rebase origin master || true
          git push origin HEAD
          echo "✅ Файл subscription успешно обновлен!"

      # ─── АВТОМАТИЧЕСКАЯ ОЧИСТКА ИСТОРИИ WORKFLOW ───
      # Исправленная версия: через REST API + jq, без подавления ошибок.
      # Удаляет ВСЕ запуски, кроме текущего.
      - name: 🧹 Clean old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Очистка старых запусков Workflow..."
          CURRENT="${{ github.run_id }}"
          RESP=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/runs?per_page=100")
          # Получаем ID всех запусков, кроме текущего
          echo "$RESP" | jq -r --argjson cur "$CURRENT" '.workflow_runs[] | select(.id != $cur) | .id' | while read -r rid; do
            echo "Удаляю запуск #$rid ..."
            curl -s -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${rid}"
            echo
          done
          echo "✅ Готово."
