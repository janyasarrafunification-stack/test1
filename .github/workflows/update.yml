name: Auto Update VPN Subscription

on:
  schedule:
    # Запуск каждые 30 минут автоматически
    - cron: '*/30 * * * *'
  workflow_dispatch: # Кнопка для ручного запуска в любое время

permissions:
  contents: write

jobs:
  update-vpn:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2 aiohttp aiohttp-socks PySocks urllib3 maxminddb
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: ⚙️ Setup Xray Core
        run: |
          if [ ! -f ./xray ] || [ ! -x ./xray ]; then
            echo "Скачивание ядра Xray Core..."
            curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
            unzip -o xray.zip xray geoip.dat geosite.dat 2>/dev/null || true
            rm -f xray.zip
          fi
          chmod +x ./xray
          ./xray version

      - name: 🚀 Run VPN Scanner (Тестирование серверов)
        run: python main.py

      - name: 📤 Commit and Push results to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем полученные рабочие конфиги и статистику
          git add FL1PVPN stats.json history.json reserve_pool.json logs/ 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "Все серверы проверены, новых изменений нет."
          else
            COUNT=$(python3 -c "import json; print(len(json.load(open('stats.json'))['servers']))" 2>/dev/null || echo "?")
            git commit -m "🚀 Auto-Update: $COUNT Active Servers | $(date -u +'%Y-%m-%d %H:%M UTC')"
            git stash --include-untracked
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD
            echo "✅ Файл FL1PVPN успешно обновлен в репозитории!"
          fi
