name: Auto Update VPN Subscription

on:
  schedule:
    # Автозапуск каждые 30 минут
    - cron: '*/30 * * * *'
  workflow_dispatch: # Кнопка ручного запуска

permissions:
  contents: write

jobs:
  update-vpn:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2 aiohttp aiohttp-socks PySocks urllib3 maxminddb
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: ⚙️ Setup Xray Core
        run: |
          if [ ! -f ./xray ] || [ ! -x ./xray ]; then
            echo "Скачивание ядра Xray Core..."
            curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o xray.zip
            unzip -o xray.zip xray geoip.dat geosite.dat 2>/dev/null || true
            rm -f xray.zip
          fi
          chmod +x ./xray
          ./xray version

      - name: 🚀 Run VPN Scanner (Тестирование серверов)
        run: python main.py

      - name: 📝 Update timestamp and commit results
        run: |
          COUNT=$(python3 -c "import json; print(len(json.load(open('stats.json'))['servers']))" 2>/dev/null || echo "0")
          NOW_UTC=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          # Записываем метку времени последней проверки
          echo "Последнее сканирование: $NOW_UTC" > last_update.txt
          echo "Рабочих серверов: $COUNT" >> last_update.txt
          
          # Настройка Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Добавляем все измененные файлы
          git add -A
          
          # Коммитим и пушим в репозиторий
          git commit -m "🚀 Update: $COUNT Servers | $NOW_UTC" || echo "Коммит уже существует"
          git pull --rebase origin main || git pull --rebase origin master || true
          git push origin HEAD
          echo "✅ Результаты успешно отправлены в ваш репозиторий!"

      # Прикрепляем файл подписки прямо к отчету в Actions для мгновенного скачивания
      - name: 📦 Upload FL1PVPN as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FL1PVPN-Config-File
          path: |
            FL1PVPN
            stats.json
            last_update.txt
          retention-days: 7
